name: Notify Isolde

on:
  push:
    branches: [main]
    paths-ignore:
      - '.obsidian/**'
      - '.vscode/**'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Test Auth
        env:
          ISOLDE_DISPATCH_TOKEN: ${{ secrets.ISOLDE_DISPATCH_TOKEN }}
        run: |
          curl -s -H "Authorization: Bearer $ISOLDE_DISPATCH_TOKEN" https://api.github.com/repos/loctran016/Isolde
      - name: Tell Isolde the notes changed
        env:
          ISOLDE_DISPATCH_TOKEN: ${{ secrets.ISOLDE_DISPATCH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${ISOLDE_DISPATCH_TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.github.com/repos/loctran016/Isolde/dispatches \
            -d '{"event_type":"content-updated","client_payload":{"repo":"loctran016/y","ref":"refs/heads/main","sha":"'"$GITHUB_SHA"'"}}'
